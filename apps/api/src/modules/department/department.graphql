type Department {
  id: ID!
  name: String!
  subtitle: String!
  location: String!
  managerId: ID!
  manager: User!
  employees: [User!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  isDeleted: Boolean!
}

input CreateDepartmentInput {
  name: String!
  subtitle: String!
  location: String!
  managerId: ID!
  employeeIds: [ID!]
}

input UpdateDepartmentInput {
  name: String
  subtitle: String
  location: String
  managerId: ID
  employeeIds: [ID!]
}

type DepartmentListResponse {
  results: [Department!]!
  totalCount: Int!
}

extend type Query {
  getDepartments(offset: Int, limit: Int): DepartmentListResponse!
  getDepartmentById(id: ID!): Department
}

extend type Mutation {
  createDepartment(input: CreateDepartmentInput!): Department
  updateDepartmentById(id: ID!, input: UpdateDepartmentInput!): Department
  deleteDepartmentById(id: ID!): Department
}
